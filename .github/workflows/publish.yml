name: Publish Extensions

on:
  release:
    types: [published]

jobs:
  publish-vscode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.x

      - name: Install dependencies
        working-directory: ./vscode
        run: npm ci

      - name: Publish
        working-directory: ./vscode
        env:
          PUBLISHER_TOKEN: ${{ secrets.PUBLISHER_TOKEN }}
        run: node_modules/.bin/vsce publish -p $PUBLISHER_TOKEN --baseImagesUrl https://github.com/reduckted/GitWebLinks/raw/HEAD/vscode

  publish-visual-studio:
    runs-on: windows-2022

    env:
      Configuration: Release
      DeployExtension: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6

      - name: Publish
        working-directory: ./visual-studio/source/GitWebLinks
        run: |
          dotnet restore
          dotnet msbuild -target:PublishToMarketplace -property:BuildBeforePublish=true -property:PersonalAccessToken=${{ secrets.PUBLISHER_TOKEN }}
